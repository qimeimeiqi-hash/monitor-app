# 机票价格监测目标（直飞）。数据来自 Amadeus for Developers 的免费 Flight Cheapest Date
# Search API，每条 route 每次运行只发起 1 次 API 调用（在 look_ahead_days 范围内一次性拿到最低价），
# 不是逐天轮询，用来控制免费额度消耗。
#
# 字段说明：
#   name              展示名称（同时用于生成本地存档文件名，建议用中文即可）
#   origin/destination  IATA 城市代码：SHA=上海（虹桥+浦东）、DLC=大连、TYO=东京（成田+羽田）
#   trip_type          oneway（单程）或 roundtrip（往返）
#   look_ahead_days    从明天起，未来多少天内找最低价（数值越大，Amadeus 返回的候选日期越多，
#                       但不会增加调用次数——一次调用带一个日期区间）
#   min_stay_days/max_stay_days  仅 roundtrip 生效：往返之间愿意接受的在外天数区间
#   nonstop_only       是否只看直飞（对应你的“直飞机票”需求，固定 true）
#   currency            询价货币代码
#   price_threshold     价格阈值：最低价低于这个数才会发邮件提醒。
#                        !!! 下面填的是占位值，几乎不会被真实触发，正式使用前请改成你自己觉得划算的价格 !!!
#   enabled             是否参与本次运行
routes:
  - name: "上海 → 东京 单程"
    origin: "SHA"
    destination: "TYO"
    trip_type: "oneway"
    look_ahead_days: 21
    nonstop_only: true
    currency: "CNY"
    price_threshold: 100
    enabled: true

  - name: "上海 ⇄ 东京 往返"
    origin: "SHA"
    destination: "TYO"
    trip_type: "roundtrip"
    look_ahead_days: 21
    min_stay_days: 3
    max_stay_days: 14
    nonstop_only: true
    currency: "CNY"
    price_threshold: 100
    enabled: true

  - name: "大连 → 东京 单程"
    origin: "DLC"
    destination: "TYO"
    trip_type: "oneway"
    look_ahead_days: 21
    nonstop_only: true
    currency: "CNY"
    price_threshold: 100
    enabled: true

  - name: "大连 ⇄ 东京 往返"
    origin: "DLC"
    destination: "TYO"
    trip_type: "roundtrip"
    look_ahead_days: 21
    min_stay_days: 3
    max_stay_days: 14
    nonstop_only: true
    currency: "CNY"
    price_threshold: 100
    enabled: true
