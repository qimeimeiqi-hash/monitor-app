<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网页数据变动监测面板</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f172a'/%3E%3Cpath d='M5 17V10M12 17V6M19 17V13' stroke='%2360a5fa' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>网页数据变动监测面板</h1>
    <p class="subtitle">数据由 GitHub Actions 定时抓取并自动更新</p>
  </header>

  <main>
    <section>
      <h2>最新状态</h2>
      <div id="latest-status-list" class="status-grid"></div>
    </section>

    <section>
      <h2>变动趋势</h2>
      <div id="trend-charts" class="chart-grid"></div>
    </section>

    <section>
      <h2>机票价格 · 最新状态</h2>
      <p class="subtitle">上海/大连 ⇄ 东京 直飞，未来若干天内的最低价（数据来自 Amadeus）</p>
      <div id="flight-status-list" class="status-grid"></div>
    </section>

    <section>
      <h2>机票价格 · 降价提醒趋势</h2>
      <div id="flight-trend-charts" class="chart-grid"></div>
    </section>
  </main>

  <footer>
    <p>Python + Resend + Chart.js + GitHub Actions · 零成本部署于 GitHub Pages</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
